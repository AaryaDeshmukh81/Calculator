
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="calculator">
        <header class="header">
            <div class="brand">
                <div class="logo">N</div>
                <div>
                    <h1>Nova Calculator</h1>
                    <p>Simple. Smart. Precise.</p>
                </div>
            </div>
            <span class="status">● ONLINE</span>
        </header>

        <section class="display" aria-label="Calculator display">
            <div id="expression" class="expression">Ready to calculate</div>
            <div id="result" class="result" aria-live="polite">0</div>
        </section>

        <section class="keypad" aria-label="Calculator keys">
            <button class="key utility" data-action="clear">AC</button>
            <button class="key utility" data-action="delete">DEL</button>
            <button class="key operator" data-value="%">%</button>
            <button class="key operator" data-value="/">÷</button>

            <button class="key" data-value="7">7</button>
            <button class="key" data-value="8">8</button>
            <button class="key" data-value="9">9</button>
            <button class="key operator" data-value="*">×</button>

            <button class="key" data-value="4">4</button>
            <button class="key" data-value="5">5</button>
            <button class="key" data-value="6">6</button>
            <button class="key operator" data-value="-">−</button>

            <button class="key" data-value="1">1</button>
            <button class="key" data-value="2">2</button>
            <button class="key" data-value="3">3</button>
            <button class="key operator" data-value="+">+</button>

            <button class="key utility" data-action="sign">+/−</button>
            <button class="key" data-value="0">0</button>
            <button class="key" data-value=".">.</button>
            <button class="key equals" data-action="calculate">=</button>
        </section>

        <footer>
            <span>Keyboard enabled</span>
            <span>Built with HTML · CSS · JS</span>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
